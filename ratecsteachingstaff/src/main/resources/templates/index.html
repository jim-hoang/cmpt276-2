<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/styles.css">
    <title>CS Teaching Staff Ratings</title>
</head>
<body>
    <header>
        <div class="container-fluid title">
            <h1 class="title-font">CS Teaching Staff Ratings</h1>
        </div>
    </header>

    <main>
        <div class="container summary">
            <div class="row mt-5"> 
                <div class="col-sm-12 col-md-12 col-lg-12">
                    <table class="table table-bordered">
                        <tr>
                            <th class="table-header-fixed-width">Name</th>
                            <th class="table-header-fixed-width">Email</th>
                            <th class="table-header-fixed-width">Occuptation</th>
                            <th class="table-header-fixed-width">Overall Score</th>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
