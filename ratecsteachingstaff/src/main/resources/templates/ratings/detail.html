<!DOCTYPE html>
<html lang="en">
<head>
    <!-- ...existing code... -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/styles.css">
    <title>Rating Details</title>
</head>
<body>
    <header>
        <div class="container-fluid title">
            <h1 class="title-font">CS Teaching Staff Ratings</h1>
        </div>
    </header>

    <main>
        <div class="container detail-container mt-4">
            <div class="row">
                <div class="col">
                    <div class="card">
                        <h3 th:text="${rating.name}">Name</h3>
                        <p><strong>Email:</strong> <div th:text="${rating.email}">email</div></p>
                        <p><strong>Role:</strong> <div th:text="${rating.roleType}">role</div></p>
                        <p><strong>Created:</strong> <div th:text="${rating.createdAt}">date</div></p>
                        <p><strong>Updated:</strong> <div th:text="${rating.updatedAt}">date</div></p>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <h4>Scores</h4>
                        <p><strong>Clarity:</strong> <div th:text="${rating.clarity}">0</div></p>
                        <p><strong>Niceness:</strong> <div th:text="${rating.niceness}">0</div></p>
                        <p><strong>Knowledgeable:</strong> <div th:text="${rating.knowledgeableScore}">0</div></p>
                        <p><strong>Overall:</strong> 
                            <div th:text="${#numbers.formatDecimal((rating.knowledgeableScore + rating.niceness + rating.clarity)/3.0, 1, 1)}">0.0</div>
                        </p>
                        <p><strong>Comment:</strong></p>
                        <p th:text="${rating.comment}">comment</p>
                    </div>
                </div>
            </div>

            <div>
                <a class="btn btn-secondary" th:href="@{/}">Back</a>
                <a class="btn btn-primary" th:href="@{/ratings/{id}/edit(id=${rating.id})}">Edit</a>
                <a class="btn btn-primary" id="delete-button" th:href="@{/ratings/{id}/delete(id=${rating.id})}">Delete</a>
            </div>
        </div>
    </main>
</body>
