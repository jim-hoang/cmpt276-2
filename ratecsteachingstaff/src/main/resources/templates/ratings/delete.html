<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/styles.css">
    <title>Delete Rating</title>
</head>
<body>
    <header>
        <div class="container-fluid title">
            <h1 class="title-font">CS Teaching Staff Ratings</h1>
        </div>
    </header>

    <main>
        <div class="container warn-container">
            <div class="row">
                <div class="col text-center">
                    <h2 class="sub-header">Confirm Deletion</h2>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-12 col-md-8 col-lg-6 mx-auto text-center">
                    <div class="warning">
                        <h3 class="text-center">Are you sure?</h4>
                        <p>You are about to permanently delete the rating for:</p>
                        <p><strong th:text="${rating.name} + ' (' + ${rating.roleType} + ')'">Name</strong></p>
                        <p class="mb-0">This action cannot be undone.</p>
                    </div>
                    
                    <form th:action="@{/ratings/delete}" method="post" class="mt-4">
                        <input type="hidden" name="id" th:value="${rating.id}">
                        <button type="submit" class="btn btn-primary" id="delete-button">Yes, Delete</button>
                        <a class="btn btn-secondary" th:href="@{/ratings/{id}(id=${rating.id})}">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
